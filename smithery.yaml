# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - salesbuildrApiKey
      - salesbuildrBaseUrl
    properties:
      salesbuildrApiKey:
        type: string
        description: Your SalesBuildr API key
      salesbuildrBaseUrl:
        type: string
        description: Your SalesBuildr instance base URL
  commandFunction: |-
    (config) => ({ command: 'node', args: ['dist/index.js'], env: { SALESBUILDR_API_KEY: config.salesbuildrApiKey, SALESBUILDR_BASE_URL: config.salesbuildrBaseUrl, MCP_TRANSPORT: 'stdio' } })
